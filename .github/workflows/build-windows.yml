name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pyinstaller requests psutil py-cpuinfo pillow

      - name: Build Standard exe
        run: pyinstaller --clean --noconfirm LocalAI.spec


      - name: Build SE exe
        run: pyinstaller --clean --noconfirm LocalAI_SE.spec


      - name: Build CloudAI exe
        run: pyinstaller --clean --noconfirm CloudAI.spec

      - name: Build VirtualWorld
        run: |
          cmake -S virtualworld -B build/virtualworld -DCMAKE_BUILD_TYPE=Release
          cmake --build build/virtualworld --config Release
          if (Test-Path "build/virtualworld/Release/VirtualWorld.exe") {
            Copy-Item "build/virtualworld/Release/VirtualWorld.exe" "dist/VirtualWorld.exe" -Force
          } else {
            Copy-Item "build/virtualworld/VirtualWorld.exe" "dist/VirtualWorld.exe" -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-Windows-x64-1.0
          path: |
            dist/LocalAI.exe
            dist/LocalAI_SE.exe
            dist/CloudAI.exe
            dist/VirtualWorld.exe
