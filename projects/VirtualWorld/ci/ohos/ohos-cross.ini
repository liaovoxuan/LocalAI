[binaries]
c = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang'
cpp = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang++'
ar = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/llvm-ar'
ranlib = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/llvm-ranlib'
strip = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/llvm-strip'
nm = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/llvm-nm'
objcopy = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/llvm-objcopy'
ld = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/ld.lld'
pkg-config = '/opt/homebrew/bin/pkg-config'
cmake = '/opt/homebrew/bin/cmake'

[properties]
# pkg-config search dir is locked to our private prefix so glib only sees the
# libffi/pcre2 we cross-built (never Homebrew/Darwin .pc files).
pkg_config_libdir = '/Users/liaoboxuan/Desktop/各种学习和娱乐资料/开发/LocalAI/projects/VirtualWorld/build-qemu-ohos-deps/prefix/lib/pkgconfig'
# NOTE: we deliberately DO NOT set sys_root here. The OHOS clang WRAPPER
# already bakes in --sysroot=<SDK>/sysroot, and if meson's sys_root property is
# also set it would relocate the ABSOLUTE -I/-L paths from our .pc files to
# <sysroot>/Users/.../prefix/include (broken). The wrapper-supplied sysroot is
# sufficient; meson must pass our prefix include/lib paths through verbatim.

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[target_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
